<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Email - Sistema de Invitaciones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status-box {
            background: #f5f5f5;
            border-left: 4px solid #2196f3;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .status-box strong {
            color: #2196f3;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c2002f 0%, #a00026 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(194, 0, 47, 0.3);
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #c2002f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            margin-top: 15px;
            color: #333;
        }

        .details {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .detail-value {
            color: #666;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Prueba de Email</h1>
            <p>Sistema de Invitaciones a Evento</p>
        </div>

        <div id="message" class="message"></div>

        <div class="status-box">
            ℹ️ Se enviará una invitación de prueba a <strong>alvar300bs@gmail.com</strong>
        </div>

        <div class="details">
            <div class="detail-row">
                <span class="detail-label">Tipo de Evento:</span>
                <span class="detail-value">Prueba</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Destinatario:</span>
                <span class="detail-value">Prueba Sistema</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value">alvar300bs@gmail.com</span>
            </div>
        </div>

        <button class="button" id="sendBtn" onclick="sendTestEmail()">
            📨 Enviar Email de Prueba
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="spinner-text">Enviando email...</div>
        </div>
    </div>

    <script>
        async function sendTestEmail() {
            const sendBtn = document.getElementById('sendBtn');
            const messageDiv = document.getElementById('message');
            const loading = document.getElementById('loading');

            sendBtn.disabled = true;
            loading.style.display = 'block';

            // Datos del evento de prueba
            const testEventData = {
                eventName: "Evento de Prueba",
                eventEdition: "2026",
                eventDescription: "Este es un email de prueba del sistema de invitaciones.",
                eventDate: "2026-06-15",
                eventTime: "10:00",
                eventDuration: "120",
                registrationDeadline: "2026-06-10",
                venue: "Centro de Convenciones Prueba",
                city: "La Paz",
                country: "Bolivia",
                address: "Calle Principal 123",
                registrationLink: "https://ejemplo.com/registro",
                zoomLink: "https://zoom.us/j/ejemplo",
                contactEmail: "prueba@evento.com",
                contactPhone: "+1 234 567 8900",
                speakers: [
                    {
                        name: "Conferencista Prueba",
                        title: "Especialista en Tecnología"
                    },
                    {
                        name: "Orador Invitado",
                        title: "Director General"
                    }
                ]
            };

            try {
                // Enviar invitación de prueba
                const response = await fetch('http://localhost:5000/api/send-invitation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipientName: "Prueba Usuario",
                        recipientEmail: "alvar300bs@gmail.com",
                        subject: "✅ Prueba del Sistema - Email de Invitación",
                        message: "Este es un email de prueba para verificar que el sistema de invitaciones está funcionando correctamente.",
                        eventData: testEventData
                    })
                });

                loading.style.display = 'none';

                if (response.ok) {
                    showMessage('✅ ¡Email enviado exitosamente a alvar300bs@gmail.com! Revisa tu bandeja de entrada.', 'success', messageDiv);
                } else {
                    const error = await response.json();
                    showMessage(`❌ Error: ${error.error || 'No se pudo enviar el email'}`, 'error', messageDiv);
                }
            } catch (error) {
                loading.style.display = 'none';
                console.error('Error:', error);
                showMessage(`❌ Error de conexión: Verifica que el servidor está corriendo en http://localhost:5000`, 'error', messageDiv);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function showMessage(text, type, messageDiv) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;

            // Auto-desaparecer
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 8000);
        }

        // Verificar conexión al cargar
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('http://localhost:5000/api/event');
                if (response.ok || response.status === 404) {
                    // Servidor conectado
                }
            } catch (error) {
                const messageDiv = document.getElementById('message');
                showMessage('⚠️ El servidor no está conectado. Inicia Node.js con: pnpm start', 'info', messageDiv);
            }
        });
    </script>
</body>
</html>
